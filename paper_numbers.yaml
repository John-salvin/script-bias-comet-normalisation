# paper_numbers.yaml -- ground-truth registry.
#
# WHAT THIS IS
#   Each entry records a reported quantity together with the tolerance within
#   which it should reproduce. The values are recorded independently of the
#   code in this repository; scripts/verify_paper_numbers.py recomputes each
#   one from the committed workbooks and compares.
#
# STATUS
#   verified : recomputed from the committed data and asserted.
#   script   : RNG-dependent (split / GBM / permutation); reproducible only
#              under meta.seeds below.

meta:
  paper_title: >-
    Making COMET Comparable Across Scripts: Diagnosis and Correction of
    Tokeniser-Induced Script Bias in Indic MT Evaluation
  language_order: [GUJ, TAM, MAL, MAR, HIN]
  seeds:
    split: 42        # numpy RandomState(42).choice -- NOT sklearn train_test_split
    gbm: 0
    permutation: 0
  bases:
    full: 7000
    working: 6995
    mar_severity: 1258

